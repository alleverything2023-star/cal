<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Call</title>
</head>
<body>

<h1>Call Site</h1>

<video
  id="localVideo"
  autoplay
  muted
  playsinline
  width="400">
</video>

<p id="status">準備中...</p>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";

const firebaseConfig = {
  apiKey: "AIzaSyC8xaZlj3hnMNYeppvbtxZFLqw4q-9ca9g",
  authDomain: "call-a9823.firebaseapp.com",
  projectId: "call-a9823",
  storageBucket: "call-a9823.firebasestorage.app",
  messagingSenderId: "656862118456",
  appId: "1:656862118456:web:46dc8bfbdaf355ef9b9ccd",
  measurementId: "G-DRZKNJF6NY"
};

initializeApp(firebaseConfig);

const status = document.getElementById("status");

try {
  const stream =
    await navigator.mediaDevices.getUserMedia({
      video: true,
      audio: true
    });

  document.getElementById("localVideo").srcObject =
    stream;

  status.textContent =
    "カメラ・マイク取得成功";

} catch(err) {

  status.textContent =
    "カメラ取得失敗: " + err.message;

}

</script>

</body>
</html>
