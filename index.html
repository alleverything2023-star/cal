<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Call</title>

<style>
body{
    font-family:sans-serif;
    max-width:600px;
    margin:auto;
    padding:20px;
}

label{
    display:block;
    margin-top:15px;
}

select,input,button{
    width:100%;
    padding:10px;
    margin-top:5px;
}

video{
    width:100%;
    margin-top:20px;
    border:1px solid #ccc;
}

#room{
    display:none;
}
</style>

</head>
<body>

<div id="join">

<h1>Call Site</h1>

<label>
名前
<input id="name" placeholder="名前を入力">
</label>

<label>
カメラ
<select id="cameraList"></select>
</label>

<label>
マイク
<select id="micList"></select>
</label>

<label>
<input type="checkbox" id="cameraEnabled" checked>
カメラONで入室
</label>

<label>
<input type="checkbox" id="micEnabled" checked>
マイクONで入室
</label>

<button id="joinButton">
入室
</button>

<p id="status"></p>

</div>

<div id="room">

<h2 id="displayName"></h2>

<video
id="localVideo"
autoplay
muted
playsinline>
</video>

</div>

<script>

const cameraList =
document.getElementById("cameraList");

const micList =
document.getElementById("micList");

const status =
document.getElementById("status");

async function loadDevices(){

    try{

        await navigator.mediaDevices.getUserMedia({
            video:true,
            audio:true
        });

        const devices =
        await navigator.mediaDevices.enumerateDevices();

        cameraList.innerHTML="";
        micList.innerHTML="";

        devices.forEach(device=>{

            if(device.kind==="videoinput"){

                const option =
                document.createElement("option");

                option.value=device.deviceId;
                option.text=
                device.label || "Camera";

                cameraList.appendChild(option);
            }

            if(device.kind==="audioinput"){

                const option =
                document.createElement("option");

                option.value=device.deviceId;
                option.text=
                device.label || "Microphone";

                micList.appendChild(option);
            }

        });

        status.textContent =
        "デバイス取得成功";

    }catch(err){

        status.textContent =
        err.message;
    }
}

loadDevices();

document
.getElementById("joinButton")
.addEventListener("click",async()=>{

    const name =
    document.getElementById("name")
    .value.trim();

    if(!name){

        alert("名前を入力してください");
        return;
    }

    const stream =
    await navigator.mediaDevices.getUserMedia({

        video:{
            deviceId:
            cameraList.value
            ? {exact:cameraList.value}
            : undefined
        },

        audio:{
            deviceId:
            micList.value
            ? {exact:micList.value}
            : undefined
        }

    });

    stream.getVideoTracks()
    .forEach(track=>{
        track.enabled =
        document.getElementById("cameraEnabled")
        .checked;
    });

    stream.getAudioTracks()
    .forEach(track=>{
        track.enabled =
        document.getElementById("micEnabled")
        .checked;
    });

    document
    .getElementById("localVideo")
    .srcObject = stream;

    document
    .getElementById("displayName")
    .textContent = name;

    document
    .getElementById("join")
    .style.display = "none";

    document
    .getElementById("room")
    .style.display = "block";
});

</script>

</body>
</html>
