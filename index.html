<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Call Site</title>
<link rel="stylesheet" href="./style.css">
</head>

<body>

<div id="joinScreen">

<h1>Call Site</h1>

<input
id="nameInput"
placeholder="名前">

<select id="cameraSelect"></select>

<select id="micSelect"></select>

<label>
<input
type="checkbox"
id="cameraEnabled"
checked>
カメラON
</label>

<label>
<input
type="checkbox"
id="micEnabled"
checked>
マイクON
</label>

<button id="joinButton">
入室
</button>

<p id="status"></p>

</div>

<div id="roomScreen">

<div id="topBar">
<span id="myName"></span>
</div>

<div id="videoGrid"></div>

<div id="participantPanel">

<h3>参加者</h3>

<ul id="participantList"></ul>

</div>

</div>

<script type="module" src="./app.js"></script>

</body>
</html>
