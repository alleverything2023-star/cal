<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ブラウザ通話アプリ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="dark-theme">

  <div id="joinScreen">
    <div class="setup-container">
      <h2>通話に参加</h2>
      
      <div class="preview-box">
        <video id="myPreviewVideo" autoplay playsinline muted></video>
        <div id="previewFallback" class="fallback-text" style="display: none;">カメラOFF</div>
      </div>

      <div class="toggle-controls">
        <label>
          <input type="checkbox" id="initCameraToggle" checked> カメラをONにする
        </label>
        <label>
          <input type="checkbox" id="initMicToggle" checked> マイクをONにする
        </label>
      </div>

      <div class="device-selects">
        <div class="select-field">
          <label for="cameraSelect">カメラ:</label>
          <select id="cameraSelect"></select>
        </div>
        <div class="select-field">
          <label for="micSelect">マイク:</label>
          <select id="micSelect"></select>
        </div>
      </div>

      <div class="join-form">
        <input type="text" id="nameInput" placeholder="表示名を入力してください" maxlength="15">
        <button id="joinButton">入室する</button>
      </div>
    </div>
  </div>

  <div id="roomScreen" style="display: none;">
    <div class="top-controls">
      <button id="settingsBtn" class="square-btn" title="設定">⚙️</button>
    </div>

    <div id="settingsModal" class="modal-overlay" style="display: none;">
      <div class="modal-content">
        <h3>設定</h3>
        <div class="modal-item">
          <label>テーマ:</label>
          <button id="themeToggleBtn">ライトモードに切替</button>
        </div>
        <div class="modal-item">
          <label>名前変更:</label>
          <input type="text" id="newNameInput" placeholder="新しい名前">
          <button id="updateNameBtn">更新</button>
        </div>
        <button id="closeSettingsBtn" class="close-btn">閉じる</button>
      </div>
    </div>

    <div class="app-layout" id="appLayout">
      <div class="main-content">
        <div id="leftContainer">
          <div id="videoGrid" class="count-1">
            
            <div class="videoCard" id="myVideoCard">
              <div class="video-wrapper">
                <video id="myLocalVideo" autoplay playsinline muted></video>
              </div>
              <div class="videoControlBar">
                <span class="videoName" id="myLocalName">あなた</span>
                <div class="btn-group">
                  <button id="myCamBtn" class="action-btn">
                    <svg class="icon-svg icon-cam" viewBox="0 0 24 24">
                      <path class="cam-body" d="M15 8H5a2 2 0 0 0-2 2v4a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-4a2 2 0 0 0-2-2z"/>
                      <polygon class="cam-lens" points="17 11 22 8 22 16 17 13"/>
                      <line class="slash-line" x1="3" y1="3" x2="21" y2="21" />
                    </svg>
                  </button>
                  
                  <button id="myMicBtn" class="action-btn">
                    <svg class="icon-svg icon-mic" viewBox="0 0 24 24">
                      <rect class="mic-body" x="9" y="2" width="6" height="11" rx="3"/>
                      <path class="mic-stand" d="M19 10v1a7 7 0 0 1-14 0v-1M12 18v4M8 22h8"/>
                      <line class="slash-line" x1="3" y1="3" x2="21" y2="21" />
                    </svg>
                  </button>
                </div>
              </div>
            </div>

          </div>
        </div>
      </div>

      <div id="bottomContainer">
        <p style="color: var(--text-muted); font-size: 0.8rem;">※ボトムバー</p>
      </div>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
